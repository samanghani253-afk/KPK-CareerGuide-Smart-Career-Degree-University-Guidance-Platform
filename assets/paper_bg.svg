<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paperBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F2E2"/>
      <stop offset="100%" stop-color="#F1E8D2"/>
    </linearGradient>
    <linearGradient id="foldShadeA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8A7A55" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="foldShadeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A7A55" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#paperBase)"/>

  <!-- large diagonal fold creases, evoking a folded sheet of paper -->
  <polygon points="0,0 620,0 260,900 0,900" fill="url(#foldShadeA)"/>
  <polygon points="620,0 900,0 700,900 260,900" fill="url(#foldHighlight)"/>
  <polygon points="900,0 1600,0 1600,260 1180,900 700,900" fill="url(#foldShadeB)"/>
  <polygon points="1600,260 1600,900 1180,900" fill="url(#foldShadeA)"/>

  <!-- crease lines -->
  <line x1="620" y1="0" x2="260" y2="900" stroke="#8A7A55" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="900" y1="0" x2="700" y2="900" stroke="#8A7A55" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="1600" y1="260" x2="1180" y2="900" stroke="#8A7A55" stroke-opacity="0.18" stroke-width="2"/>

  <!-- fine paper grain -->
  <g opacity="0.05">
    <line x1="0" y1="120" x2="1600" y2="120" stroke="#5C4C2E" stroke-width="1"/>
    <line x1="0" y1="360" x2="1600" y2="360" stroke="#5C4C2E" stroke-width="1"/>
    <line x1="0" y1="600" x2="1600" y2="600" stroke="#5C4C2E" stroke-width="1"/>
    <line x1="0" y1="820" x2="1600" y2="820" stroke="#5C4C2E" stroke-width="1"/>
  </g>
</svg>
